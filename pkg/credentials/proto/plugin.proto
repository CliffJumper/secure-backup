syntax = "proto3";

package credentialplugin;

option go_package = "github.com/CliffJumper/secure-backup/pkg/credentials/proto";

service CredentialProvider {
  rpc GetCredentials(GetRequest) returns (GetResponse);
  rpc SetCredentials(SetRequest) returns (Empty);
}

message GetRequest {
  string target = 1;
}

message GetResponse {
  map<string, string> credentials = 1;
}

message SetRequest {
  string target = 1;
  map<string, string> credentials = 2;
}

message Empty {}
